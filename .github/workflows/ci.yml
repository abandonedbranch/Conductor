name: CI

on:
  pull_request:
    branches: [trunk]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  SCHEME: Conductor
  PROJECT: Conductor.xcodeproj
  XCODE_VERSION: '16.0'

jobs:
  build-and-test:
    name: ${{ matrix.platform.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            destination: "platform=macOS"
          - name: iOS
            destination: "platform=iOS Simulator,name=iPhone 16"
          - name: iPadOS
            destination: "platform=iOS Simulator,name=iPad Pro 13-inch (M4)"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ matrix.platform.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO | xcpretty --color

      - name: Test
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ matrix.platform.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "results-${{ matrix.platform.name }}" | xcpretty --color

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform.name }}
          path: results-${{ matrix.platform.name }}.xcresult
